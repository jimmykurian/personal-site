# Every check and test, by one name, for local runs, the git hooks and CI.
# Tools come from .mise.toml (`mise install`) and website/node_modules (`task install`).
# Run `task` to list the tasks.

version: '3'

vars:
  # JavaScript tools installed by website/package.json, run from the repo root.
  BIN: website/node_modules/.bin
  SPELLING_GLOBS: >-
    "**/*.md" "website/src/**/*.{mdx,astro,ts,css}" "website/tests/**/*.ts" "website/scripts/**"
    ".github/**/*.yml" "infrastructure/**/*.{tf,hcl,sh}" ".gitmessage" "Taskfile.yml" ".githooks/*"
    ".devcontainer/*" ".vscode/*" ".mise.toml"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install the pinned tools and the website's dependencies
    cmds:
      - mise install
      - pnpm --dir website install --frozen-lockfile

  hooks:install:
    desc: Use the git hooks in .githooks/
    cmds:
      - git config core.hooksPath .githooks

  # Checks

  lint:
    desc: Run every check (no build needed)
    cmds:
      - task: lint:repo
      - task: lint:web
      - task: infra:check

  lint:repo:
    desc: Run the repository-wide checks
    cmds:
      - task: lint:secrets
      - task: lint:secretlint
      - task: lint:lockfile
      - task: lint:dedupe
      - task: lint:audit
      - task: lint:actions
      - task: lint:shell
      - task: lint:editorconfig
      - task: lint:markdown
      - task: lint:spelling
      - task: lint:yaml
      - task: lint:schemas

  lint:actions:
    desc: Lint the GitHub Actions workflows (actionlint, zizmor)
    cmds:
      - actionlint
      - zizmor --offline .github

  lint:secrets:
    desc: Scan the git history for secrets and non-npm registry URLs (gitleaks)
    cmds:
      - gitleaks git --no-banner --redact --config .config/gitleaks.toml .

  lint:secretlint:
    desc: Scan the tracked files for secrets with secretlint's recommended rules (gitleaks covers the history)
    cmds:
      - git ls-files -z | xargs -0 {{.BIN}}/secretlint --secretlintrc .config/secretlintrc.json --maskSecrets

  lint:lockfile:
    desc: 'Check the lockfile: registry packages only, sha512 hashes, bounded overrides, pnpm only'
    vars:
      # The pre-commit hook passes a copy of the staged lockfile.
      LOCKFILE: '{{.LOCKFILE | default "website/pnpm-lock.yaml"}}'
    cmds:
      # gitleaks skips lock files, so these checks cover the lockfile instead.
      - silent: true
        cmd: |
          status=0
          fail() { echo "lint:lockfile: $1"; status=1; }
          # pnpm writes a tarball URL only for packages from a non-default registry.
          if grep -n 'tarball:' "{{.LOCKFILE}}"; then fail 'packages from another registry (above)'; fi
          if grep -n 'integrity:' "{{.LOCKFILE}}" | grep -v 'integrity: sha512-'; then fail 'integrity hashes other than sha512 (above)'; fi
          if grep -nE 'resolution: \{[^}]*(type: git|commit:|repo:)' "{{.LOCKFILE}}"; then fail 'packages resolved from git (above)'; fi
          # An override's replacement range (after "key: ") needs an upper bound in every || branch:
          # >, >=, *, x, latest or an empty range with no < is unbounded. The selector in the key
          # ("tmp@>=0.2.0") only picks what gets replaced, so it isn't checked.
          if awk -v q=\' '
            /^overrides:/ { o = 1; next }
            /^[^ ]/ { o = 0 }
            o && NF {
              v = substr($0, index($0, ": ") + 2)
              gsub("^[" q "\"]|[" q "\"]$", "", v)
              n = split(v, alts, /\|\|/)
              for (k = 1; k <= n; k++) {
                a = alts[k]; gsub(/^ +| +$/, "", a)
                if (a ~ /^(\*|x|X|latest)?$/ || (a ~ />/ && a !~ /</)) { print NR ": " $0; found = 1; break }
              }
            }
            END { exit !found }' "{{.LOCKFILE}}"; then
            fail 'overrides with no upper bound (above); bound them with ^, ~ or <'
          fi
          if git ls-files -- '*package-lock.json' '*yarn.lock' | grep .; then fail 'npm or Yarn lock files (above); this repo uses pnpm'; fi
          exit $status

  lint:dedupe:
    desc: Check the lockfile has no duplicate versions pnpm could merge (pnpm dedupe)
    dir: website
    cmds:
      - pnpm dedupe --check

  lint:audit:
    desc: Fail on high or critical advisories in the website's dependencies (pnpm audit)
    dir: website
    cmds:
      - pnpm audit --audit-level high

  lint:shell:
    desc: Lint the shell scripts and git hooks (shellcheck)
    cmds:
      - shellcheck infrastructure/scripts/*.sh .githooks/* .devcontainer/*.sh

  lint:editorconfig:
    desc: Check every file against .editorconfig
    cmds:
      - editorconfig-checker -config .config/editorconfig-checker.json

  lint:markdown:
    desc: Lint the Markdown files (markdownlint)
    cmds:
      - '{{.BIN}}/markdownlint-cli2 --config .config/.markdownlint-cli2.jsonc'

  lint:spelling:
    desc: Spell-check the posts, pages, docs and code (cspell)
    cmds:
      - '{{.BIN}}/cspell lint --config .config/cspell.json --no-progress --dot {{.SPELLING_GLOBS}}'

  lint:yaml:
    desc: Lint the YAML files (yamllint)
    cmds:
      - git ls-files -z '*.yml' '*.yaml' ':!:website/pnpm-lock.yaml' | xargs -0 yamllint --strict -c .config/yamllint.yml

  lint:schemas:
    desc: Validate the JSON, YAML and TOML configs against their published schemas (v8r)
    cmds:
      # The files and the schemas SchemaStore can't match are in .config/v8rrc.yml.
      - '{{.BIN}}/v8r'

  lint:web:
    desc: Type-check, lint and format-check the website
    cmds:
      - task: lint:astro
      - task: lint:eslint
      - task: lint:format
      - task: lint:css
      - task: lint:dead-code

  lint:astro:
    desc: Type-check the .astro and .ts files (astro check)
    dir: website
    cmds:
      - pnpm check

  lint:eslint:
    desc: Lint the website code, with accessibility rules for .astro markup (ESLint)
    dir: website
    cmds:
      - pnpm exec eslint --max-warnings 0 .

  lint:format:
    desc: Check the website's formatting (Prettier)
    dir: website
    cmds:
      - pnpm exec prettier --check .

  lint:css:
    desc: Lint the CSS in src/ and in .astro style blocks (Stylelint)
    dir: website
    cmds:
      - pnpm exec stylelint "src/**/*.{css,astro}"

  lint:dead-code:
    desc: Find unused files, exports and dependencies (knip)
    dir: website
    cmds:
      - pnpm exec knip --no-progress

  lint:commits:
    desc: 'Check commit messages in a range: task lint:commits FROM=<sha> TO=<sha>'
    dir: website
    requires:
      vars: [FROM]
    cmds:
      - pnpm exec commitlint --config "{{.ROOT_DIR}}/.config/commitlintrc.json" --cwd "{{.ROOT_DIR}}" --from {{.FROM}} --to {{.TO | default "HEAD"}}

  lint:pr-title:
    desc: 'Check a pull request title against Conventional Commits and the scopes (PR_TITLE env)'
    dir: website
    cmds:
      # The title becomes the squash commit on main, so it gets the commit-msg rules.
      - printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --config "{{.ROOT_DIR}}/.config/commitlintrc.json" --cwd "{{.ROOT_DIR}}"

  lint:pr-template:
    desc: 'Check a pull request body against .github/PULL_REQUEST_TEMPLATE.md (PR_BODY env, or BODY_FILE=path)'
    cmds:
      - silent: true
        cmd: |
          body="$(mktemp)"
          headings="$(mktemp)"
          # GitHub sends PR bodies with CRLF line endings.
          if [ -n "{{.BODY_FILE}}" ]; then tr -d '\r' < "{{.BODY_FILE}}" > "$body"; else printf '%s\n' "${PR_BODY:-}" | tr -d '\r' > "$body"; fi
          status=0
          fail() { echo "lint:pr-template: $1"; status=1; }
          if ! grep -q '[^[:space:]]' "$body"; then fail 'the body is empty; start from .github/PULL_REQUEST_TEMPLATE.md'; fi
          # Every heading in the template must be in the body.
          grep -E '^#{1,2} ' .github/PULL_REQUEST_TEMPLATE.md > "$headings"
          while IFS= read -r heading; do
            grep -qxF "$heading" "$body" || fail "missing section: $heading"
          done < "$headings"
          # The template's instructions must be replaced. Write N/A where a section doesn't apply.
          for text in "Summarize the change and why it's needed." "Fixes # (issue)" "Delete the options that don't apply." "Add a screenshot or GIF of the change, or mark as N/A."; do
            if grep -qF "$text" "$body"; then fail "template text left in place: $text"; fi
          done
          rm -f "$body" "$headings"
          exit $status

  lint:links:
    desc: Check the external links in the built site (lychee; needs `task build`)
    cmds:
      - lychee --config .config/lychee.toml --no-progress --root-dir "$PWD/website/dist" website/dist

  format:
    desc: Format the website code (Prettier, ESLint fixes)
    dir: website
    cmds:
      - pnpm format

  # Build and tests

  build:
    desc: Build the site and print the resume PDF
    dir: website
    cmds:
      - pnpm build
      - pnpm resume

  # The test tasks pass extra arguments through: `task test -- --reporter=json ...`.

  test:
    desc: Run the unit tests with coverage
    dir: website
    cmds:
      - pnpm test:coverage {{.CLI_ARGS}}

  test:integration:
    desc: Check the built site (needs `task build`)
    dir: website
    env:
      INTEGRATION_DIST: .
    cmds:
      - pnpm test:integration {{.CLI_ARGS}}

  test:e2e:
    desc: Drive the built site in Chrome, including axe accessibility checks (needs `task build`)
    dir: website
    cmds:
      - pnpm test:e2e {{.CLI_ARGS}}

  lighthouse:
    desc: Run Lighthouse on the built site (needs `task build`)
    cmds:
      - '{{.BIN}}/lhci autorun --config=.config/lighthouserc.json'

  # Infrastructure

  infra:check:
    desc: Format, validate, lint and scan the OpenTofu modules, and check provider pins
    cmds:
      - task: infra:fmt
      - task: infra:validate
      - task: infra:tflint
      - task: infra:checkov
      - task: infra:pins

  infra:fmt:
    desc: Check the OpenTofu formatting (tofu fmt)
    dir: infrastructure
    cmds:
      - tofu fmt -recursive -check -diff

  infra:validate:
    desc: Validate each OpenTofu module (tofu validate)
    dir: infrastructure
    cmds:
      - for: { var: MODULES }
        cmd: tofu -chdir={{.ITEM}} init -backend=false -input=false > /dev/null && tofu -chdir={{.ITEM}} validate
    vars:
      MODULES:
        sh: find modules -name versions.tf -exec dirname {} \; | sort

  infra:tflint:
    desc: Lint the OpenTofu modules (TFLint)
    dir: infrastructure
    cmds:
      - tflint --init > /dev/null && tflint --recursive --config "$PWD/.tflint.hcl"

  infra:checkov:
    desc: Scan the OpenTofu modules for misconfigurations (Checkov)
    dir: infrastructure
    cmds:
      - checkov --config-file .checkov.yaml

  infra:pins:
    desc: Check every module pins the same provider version
    dir: infrastructure
    cmds:
      - ./scripts/check-provider-pins.sh

  infra:test:
    desc: 'Run the OpenTofu module tests (all, or: task infra:test -- acceptance|integration)'
    dir: infrastructure
    cmds:
      - ./scripts/run-module-tests.sh {{.CLI_ARGS}}
