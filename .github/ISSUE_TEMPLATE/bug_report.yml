name: Bug Report
description: Something on jimmykurian.me looks wrong, breaks, or won't build
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Report a bug on the site or in the build. Security issues go by email
        instead; see SECURITY.md.

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the site is affected?
      options:
        - Home
        - Writing (/writing/ or a post)
        - Reading (/reading/ or the Goodreads feed)
        - Resume (/resume/ or resume.pdf)
        - Header, footer or links
        - SEO, RSS or sitemap
        - Styles or layout
        - Build or deploy (GitHub Actions, Azure Static Web Apps)
        - Domain, DNS or email (Namecheap)
        - Other
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page URL
      description: The page where it happens, or the workflow run if the build failed.
      placeholder: https://www.jimmykurian.me/writing/
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open '...' at phone width
        2. Click '...'
        3. See '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what you expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Paste build output here if the build failed.
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.
      placeholder: Drag and drop images here...
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser shows the problem?
      multiple: true
      options:
        - Chrome
        - Safari
        - Firefox
        - Edge
        - Safari on iPhone or iPad
        - Chrome on Android
        - Other
        - N/A (build or deploy issue)
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Any additional environment details.
      placeholder: |
        - Device and OS: [e.g., iPhone 16, iOS 26; macOS 26]
        - Window width: [e.g., 390px, 1280px]
        - Light or dark mode
        - Node version (local build issues): [e.g., 22.22]
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
    validations:
      required: false
