#
# Release Please: on each push to main, keeps one release PR open that bumps the version and
# CHANGELOG.md of each package that changed (website/, infrastructure/), from the
# Conventional Commits since the last release. Merging that PR tags each package
# (website-v1.2.0, infrastructure-v0.2.0) and publishes a GitHub Release for it. Config and
# versions live in .github/release-please-config.json and .github/.release-please-manifest.json.

name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A short-lived token from Jimmy's private GitHub App, installed on this repository only.
      # GitHub signs the commits an App makes through the API, so the release commit is
      # Verified, and unlike GITHUB_TOKEN, the App's PR starts the required checks.
      - name: Create the release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
