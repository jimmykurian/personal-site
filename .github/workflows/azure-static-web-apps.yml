name: Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  # Nightly rebuild so /reading/ picks up Goodreads changes (11:00 UTC, early morning in Chicago).
  # The nightly run also checks the external links.
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Tools come from .mise.toml and each step runs a task from Taskfile.yml, so CI runs the same
# commands, at the same versions, as a local `task <name>`.

jobs:
  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the whole history; commitlint reads the pushed commits.
          fetch-depth: 0

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: node task actionlint zizmor shellcheck gitleaks editorconfig-checker

      # Installs the pnpm version pinned in website/package.json (packageManager).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
          cache: true
          cache_dependency_path: website/pnpm-lock.yaml

      - run: pnpm --dir website install --frozen-lockfile
      - run: task lint:actions
      - run: task lint:secrets
      - run: task lint:lockfile
      - run: task lint:shell
      - run: task lint:editorconfig
      - run: task lint:markdown
      - run: task lint:spelling
      # astro check, ESLint and Prettier.
      - run: task lint:web
      - run: pnpm --dir website audit --audit-level high
      - name: task lint:commits
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: task lint:commits FROM="$FROM" TO="$TO"

  build_and_deploy:
    name: Build and deploy
    needs: lint
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # lets the deploy action comment the preview URL on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: node task

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
          cache: true
          cache_dependency_path: website/pnpm-lock.yaml

      - run: pnpm --dir website install --frozen-lockfile
      # Unit tests, with coverage thresholds.
      - run: task test
      # Builds website/dist/ and prints /resume/ to resume.pdf with the runner's preinstalled Chrome.
      - run: task build
      # Checks the built site that is about to be deployed: links, feeds, content rules, config.
      - run: task test:integration
      # Drives the same build in Chrome at desktop and phone sizes, including axe checks.
      - run: task test:e2e
      # Lighthouse scores on the main pages (.config/lighthouserc.json).
      - run: task lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports
          path: |
            website/test-results/
            website/.lighthouseci/
          retention-days: 7
      # The nightly and manual runs pass the build to the link check below.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          name: dist
          path: website/dist/
          retention-days: 1

      # The site is already built, so the action only uploads website/dist/.
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: website/dist
          output_location: ''
          skip_app_build: true

  # External sites change on their own schedule, so their links are checked nightly, after
  # the deploy, instead of failing a push.
  links:
    name: External links
    needs: build_and_deploy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: task lychee

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: website/dist/

      - run: task lint:links

  close_preview:
    name: Close PR preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
