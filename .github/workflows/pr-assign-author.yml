name: Pull request assignee

# Assigns each new pull request to whoever opened it, unless someone is already assigned.
# Pull requests from other bots, such as Renovate, go to the repository owner. The repo's
# own GitHub App opens the release PRs (Release Please) and the code-metrics PRs
# (code-metrics.yml); those are assigned to its bot and request the owner's review.
# Runs on pull_request, not pull_request_target: outside pull requests aren't accepted.
on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-assign-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assign:
    name: Assign
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # adds the assignee and the reviewer
    steps:
      - name: Assign the author, or the owner for a bot, and request a review of the App's PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          OWNER: ${{ github.repository_owner }}
          ASSIGNEES: ${{ toJSON(github.event.pull_request.assignees) }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          app=false
          if [[ "$AUTHOR_TYPE" == "Bot" && ( "$HEAD_REF" == release-please--* || "$HEAD_REF" == chore/code-metrics ) ]]; then
            app=true
          fi
          if [[ "$(jq length <<< "$ASSIGNEES")" -gt 0 ]]; then
            echo "Already assigned; leaving it."
          else
            assignee="$AUTHOR"
            if [[ "$AUTHOR_TYPE" == "Bot" && "$app" != true ]]; then assignee="$OWNER"; fi
            gh api -X POST "repos/$REPO/issues/$NUMBER/assignees" -f "assignees[]=$assignee" --jq '.assignees[].login'
          fi
          if [[ "$app" == true ]]; then
            gh api -X POST "repos/$REPO/pulls/$NUMBER/requested_reviewers" -f "reviewers[]=$OWNER" --jq '.requested_reviewers[].login'
          fi
