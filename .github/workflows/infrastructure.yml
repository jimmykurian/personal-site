name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - infrastructure/**
      - .github/workflows/infrastructure.yml
      - .mise.toml
      - Taskfile.yml
  pull_request:
    branches: [main]
    paths:
      - infrastructure/**
      - .github/workflows/infrastructure.yml
      - .mise.toml
      - Taskfile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Checks and tests the OpenTofu modules. Nothing here plans or applies against Azure.
jobs:
  check:
    name: Check and test modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: task opentofu tflint uv pipx:checkov

      # fmt, validate, TFLint, Checkov and the provider pin check.
      - run: task infra:check
        env:
          # TFLint downloads its plugins from GitHub releases.
          GITHUB_TOKEN: ${{ github.token }}
      - run: task infra:test
