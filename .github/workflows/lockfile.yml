name: Lockfile

# Temporary: regenerates website/pnpm-lock.yaml against registry.npmjs.org for this branch's
# Astro and basic-ftp bumps, and uploads it as an artifact to commit by hand (signed). Removed before merge.
on:
  push:
    branches: [fix/deps-astro-basic-ftp-advisories]
    paths: [.github/workflows/lockfile.yml]

permissions:
  contents: read

jobs:
  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: node

      # Installs the pnpm version pinned in website/package.json (packageManager).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json

      - name: Resolve and dedupe the lockfile
        working-directory: website
        # Skips releases under eight days old, which the local package feed doesn't carry yet,
        # so the result also installs there.
        env:
          pnpm_config_minimum_release_age: 11520
        run: |
          # Lock Astro at 7.4.7, the first release with both fixes, then restore the caret range.
          sed -i 's|"astro": "^7.4.7"|"astro": "7.4.7"|' package.json
          pnpm install --lockfile-only --registry https://registry.npmjs.org/
          sed -i 's|"astro": "7.4.7"|"astro": "^7.4.7"|' package.json
          pnpm install --lockfile-only --registry https://registry.npmjs.org/
          pnpm dedupe --registry https://registry.npmjs.org/
          pnpm why astro basic-ftp --depth 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pnpm-lock
          path: website/pnpm-lock.yaml
          retention-days: 1
