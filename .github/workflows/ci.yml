name: CI

# Every check, the deploy, and the PR check table, in one workflow:
#
#   changes ─┬─ repository ──────┐
#            ├─ website ─────────┼─ deploy ── links (nightly)
#            └─ infrastructure ──┘
#                                └─ report (the PR comment)
#
# Each check is its own step running a task from Taskfile.yml, with tools from .mise.toml,
# so CI runs the same commands, at the same versions, as a local `task <name>`. Every step
# runs even when an earlier one fails (`!cancelled()`), so the table shows each result, and
# any failed step still fails its job.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  # Nightly rebuild so /reading/ picks up Goodreads changes (11:00 UTC, early morning in Chicago).
  # The nightly run also checks the external links.
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash -eo pipefail, so a step that pipes into tee still fails with its command.
    shell: bash

jobs:
  # A pull request runs the website and infrastructure jobs only when their files change;
  # pushes, the nightly run and manual runs check everything.
  changes:
    name: Changes
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # lists the pull request's files
    outputs:
      website: ${{ github.event_name != 'pull_request' || steps.filter.outputs.website == 'true' }}
      infrastructure: ${{ github.event_name != 'pull_request' || steps.filter.outputs.infrastructure == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            website:
              - website/**
              - .config/lighthouserc.json
              - .github/workflows/ci.yml
              - Taskfile.yml
              - .mise.toml
            infrastructure:
              - infrastructure/**
              - .github/workflows/ci.yml
              - Taskfile.yml
              - .mise.toml

  repository:
    name: Repository
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      secrets: ${{ steps.secrets.outcome }}
      secretlint: ${{ steps.secretlint.outcome }}
      lockfile: ${{ steps.lockfile.outcome }}
      dedupe: ${{ steps.dedupe.outcome }}
      audit: ${{ steps.audit.outcome }}
      actions: ${{ steps.actions.outcome }}
      shell: ${{ steps.shell.outcome }}
      editorconfig: ${{ steps.editorconfig.outcome }}
      markdown: ${{ steps.markdown.outcome }}
      spelling: ${{ steps.spelling.outcome }}
      yaml: ${{ steps.yaml.outcome }}
      schemas: ${{ steps.schemas.outcome }}
      commits: ${{ steps.commits.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the whole history; commitlint reads the pushed commits.
          fetch-depth: 0

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: node task actionlint zizmor shellcheck gitleaks editorconfig-checker uv pipx:yamllint

      # Installs the pnpm version pinned in website/package.json (packageManager).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
          cache: true
          cache_dependency_path: website/pnpm-lock.yaml

      - id: install
        run: pnpm --dir website install --frozen-lockfile
      - id: secrets
        if: ${{ !cancelled() }}
        run: task lint:secrets
      - id: secretlint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task lint:secretlint
      - id: lockfile
        if: ${{ !cancelled() }}
        run: task lint:lockfile
      - id: dedupe
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task lint:dedupe
      - id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task lint:audit
      - id: actions
        if: ${{ !cancelled() }}
        run: task lint:actions
      - id: shell
        if: ${{ !cancelled() }}
        run: task lint:shell
      - id: editorconfig
        if: ${{ !cancelled() }}
        run: task lint:editorconfig
      - id: markdown
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task lint:markdown
      - id: spelling
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task lint:spelling
      - id: yaml
        if: ${{ !cancelled() }}
        run: task lint:yaml
      - id: schemas
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task lint:schemas
      - id: commits
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success' && (github.event_name == 'pull_request'
          || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')) }}
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: task lint:commits FROM="$FROM" TO="$TO"

  website:
    name: Website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      astro: ${{ steps.astro.outcome }}
      eslint: ${{ steps.eslint.outcome }}
      format: ${{ steps.format.outcome }}
      css: ${{ steps.css.outcome }}
      dead_code: ${{ steps.dead_code.outcome }}
      unit: ${{ steps.unit.outcome }}
      build: ${{ steps.build.outcome }}
      integration: ${{ steps.integration.outcome }}
      e2e: ${{ steps.e2e.outcome }}
      lighthouse: ${{ steps.lighthouse.outcome }}
      line_coverage: ${{ steps.metrics.outputs.line_coverage }}
      branch_coverage: ${{ steps.metrics.outputs.branch_coverage }}
      unit_passed: ${{ steps.metrics.outputs.unit_passed }}
      unit_total: ${{ steps.metrics.outputs.unit_total }}
      integration_passed: ${{ steps.metrics.outputs.integration_passed }}
      integration_total: ${{ steps.metrics.outputs.integration_total }}
      e2e_passed: ${{ steps.metrics.outputs.e2e_passed }}
      e2e_total: ${{ steps.metrics.outputs.e2e_total }}
      e2e_skipped: ${{ steps.metrics.outputs.e2e_skipped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: node task

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
          cache: true
          cache_dependency_path: website/pnpm-lock.yaml

      - id: install
        run: pnpm --dir website install --frozen-lockfile
      - id: astro
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task lint:astro
      - id: eslint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task lint:eslint
      - id: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task lint:format
      - id: css
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task lint:css
      - id: dead_code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task lint:dead-code
      # Unit tests with the coverage thresholds; the JSON report feeds the table's counts.
      - id: unit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task test -- --reporter=default --reporter=json --outputFile.json=reports/unit.json
      # Builds website/dist/ and prints /resume/ to resume.pdf with the runner's preinstalled Chrome.
      - id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task build
      # Checks the built site that is about to be deployed: links, feeds, content rules, config.
      - id: integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: task test:integration -- --reporter=default --reporter=json --outputFile.json=reports/integration.json
      # Drives the same build in Chrome at desktop and phone sizes, including axe checks.
      - id: e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: task test:e2e
      # Lighthouse scores on the main pages (.config/lighthouserc.json).
      - id: lighthouse
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: task lighthouse

      - id: metrics
        name: Collect coverage and test counts
        if: ${{ !cancelled() }}
        working-directory: website
        run: |
          {
            if [[ -f coverage/coverage-summary.json ]]; then
              echo "line_coverage=$(jq '.total.lines.pct' coverage/coverage-summary.json)"
              echo "branch_coverage=$(jq '.total.branches.pct' coverage/coverage-summary.json)"
            fi
            for suite in unit integration; do
              if [[ -f "reports/$suite.json" ]]; then
                echo "${suite}_passed=$(jq '.numPassedTests' "reports/$suite.json")"
                echo "${suite}_total=$(jq '.numTotalTests' "reports/$suite.json")"
              fi
            done
            if [[ -f reports/e2e.json ]]; then
              # Tests skipped at one size (phone-only or desktop-only checks) aren't counted.
              echo "e2e_passed=$(jq '.stats.expected + .stats.flaky' reports/e2e.json)"
              echo "e2e_total=$(jq '.stats.expected + .stats.flaky + .stats.unexpected' reports/e2e.json)"
              echo "e2e_skipped=$(jq '.stats.skipped' reports/e2e.json)"
            fi
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports
          path: |
            website/test-results/
            website/.lighthouseci/
          retention-days: 7
      # The deploy and the nightly link check use this build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: dist
          path: website/dist/
          retention-days: 1

  infrastructure:
    name: Infrastructure
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      fmt: ${{ steps.fmt.outcome }}
      validate: ${{ steps.validate.outcome }}
      tflint: ${{ steps.tflint.outcome }}
      checkov: ${{ steps.checkov.outcome }}
      pins: ${{ steps.pins.outcome }}
      acceptance: ${{ steps.acceptance.outcome }}
      integration: ${{ steps.integration.outcome }}
      acceptance_passed: ${{ steps.metrics.outputs.acceptance_passed }}
      acceptance_total: ${{ steps.metrics.outputs.acceptance_total }}
      integration_passed: ${{ steps.metrics.outputs.integration_passed }}
      integration_total: ${{ steps.metrics.outputs.integration_total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: task opentofu tflint uv pipx:checkov

      - id: fmt
        run: task infra:fmt
      - id: validate
        if: ${{ !cancelled() }}
        run: task infra:validate
      - id: tflint
        if: ${{ !cancelled() }}
        env:
          # TFLint downloads its plugins from GitHub releases.
          GITHUB_TOKEN: ${{ github.token }}
        run: task infra:tflint
      - id: checkov
        if: ${{ !cancelled() }}
        run: task infra:checkov
      - id: pins
        if: ${{ !cancelled() }}
        run: task infra:pins
      - id: acceptance
        if: ${{ !cancelled() }}
        run: mkdir -p reports && task infra:test -- acceptance | tee reports/acceptance.txt
      - id: integration
        if: ${{ !cancelled() }}
        run: mkdir -p reports && task infra:test -- integration | tee reports/integration.txt

      # run-module-tests.sh ends with "=== <passed> passed, <failed> failed" (test files).
      - id: metrics
        name: Collect test counts
        if: ${{ !cancelled() }}
        run: |
          for suite in acceptance integration; do
            line="$(grep -E '^=== [0-9]+ passed, [0-9]+ failed' "reports/$suite.txt" 2>/dev/null | tail -1 || true)"
            if [[ "$line" =~ ([0-9]+)\ passed,\ ([0-9]+)\ failed ]]; then
              echo "${suite}_passed=${BASH_REMATCH[1]}"
              echo "${suite}_total=$((BASH_REMATCH[1] + BASH_REMATCH[2]))"
            fi
          done >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: [changes, repository, website, infrastructure]
    # Only a fully passing run deploys: production on main, a preview for a pull request.
    if: >-
      ${{ always() && needs.repository.result == 'success' && needs.website.result == 'success'
      && (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # lets the deploy action comment the preview URL on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: website/dist/

      # The site is already built, so the action only uploads website/dist/.
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: website/dist
          output_location: ''
          skip_app_build: true

  # External sites change on their own schedule, so their links are checked nightly, after
  # the deploy, instead of failing a push.
  links:
    name: External links
    needs: deploy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: task lychee

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: website/dist/

      - run: task lint:links

  # Posts (or updates) one comment on the pull request with a table of every check.
  report:
    name: Check table
    needs: [changes, repository, website, infrastructure]
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # creates and updates the comment
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const marker = '<!-- pr-check-table -->';
            const shown = {
              success: '✅ Passed',
              failure: '❌ Failed',
              cancelled: '⏹️ Cancelled',
              skipped: '⏭️ Skipped',
            };
            const result = (outcome) => shown[outcome] ?? '⏭️ Skipped';

            // [emoji, check, output] rows, then [metric, value] rows for the details.
            const sections = [
              {
                title: 'Website',
                job: 'website',
                rows: [
                  ['📘', 'TypeScript (astro check)', 'astro'],
                  ['🔍', 'ESLint, with accessibility rules', 'eslint'],
                  ['✨', 'Prettier', 'format'],
                  ['🎨', 'Stylelint', 'css'],
                  ['🧹', 'Dead code (knip)', 'dead_code'],
                  ['🧪', 'Unit tests and coverage', 'unit'],
                  ['🏗️', 'Build and resume PDF', 'build'],
                  ['🔗', 'Integration tests', 'integration'],
                  ['🖥️', 'End-to-end and axe (Chrome)', 'e2e'],
                  ['🚀', 'Lighthouse', 'lighthouse'],
                ],
                metrics: (o) => [
                  ['Line coverage', o.line_coverage && `${o.line_coverage}%`],
                  ['Branch coverage', o.branch_coverage && `${o.branch_coverage}%`],
                  ['Unit tests', o.unit_total && `${o.unit_passed}/${o.unit_total}`],
                  ['Integration tests', o.integration_total && `${o.integration_passed}/${o.integration_total}`],
                  ['End-to-end tests', o.e2e_total && `${o.e2e_passed}/${o.e2e_total}`],
                  ['End-to-end tests skipped at one size', o.e2e_skipped && o.e2e_skipped !== '0' && o.e2e_skipped],
                ],
              },
              {
                title: 'Infrastructure',
                job: 'infrastructure',
                rows: [
                  ['📐', 'Format (tofu fmt)', 'fmt'],
                  ['✅', 'Validate', 'validate'],
                  ['🔍', 'TFLint', 'tflint'],
                  ['🛡️', 'Security (Checkov)', 'checkov'],
                  ['📌', 'Provider pins', 'pins'],
                  ['🧪', 'Acceptance tests', 'acceptance'],
                  ['🔗', 'Integration tests', 'integration'],
                ],
                metrics: (o) => [
                  ['Acceptance test files', o.acceptance_total && `${o.acceptance_passed}/${o.acceptance_total}`],
                  ['Integration test files', o.integration_total && `${o.integration_passed}/${o.integration_total}`],
                ],
              },
              {
                title: 'Repository',
                job: 'repository',
                rows: [
                  ['🔑', 'Secret scan, git history (gitleaks)', 'secrets'],
                  ['🔐', 'Secret scan, current files (secretlint)', 'secretlint'],
                  ['📦', 'Lockfile rules', 'lockfile'],
                  ['📦', 'Lockfile dedupe', 'dedupe'],
                  ['🔒', 'npm audit', 'audit'],
                  ['🔧', 'Workflow lint (actionlint, zizmor)', 'actions'],
                  ['🐚', 'Shell lint (shellcheck)', 'shell'],
                  ['📐', 'EditorConfig', 'editorconfig'],
                  ['📝', 'Markdown lint', 'markdown'],
                  ['📖', 'Spelling (cspell)', 'spelling'],
                  ['📋', 'YAML lint', 'yaml'],
                  ['🗂️', 'Config schemas (v8r)', 'schemas'],
                  ['💬', 'Commit messages (commitlint)', 'commits'],
                ],
              },
            ];

            // Passing means every job either succeeded or was skipped on purpose: a website
            // or infrastructure job whose files didn't change. A failed or cancelled job,
            // including Changes, or a job that didn't run because Changes failed, fails it.
            const changesRan = needs.changes?.result === 'success';
            const notRun = (r) => r === 'failure' || r === 'cancelled' || (r === 'skipped' && !changesRan);
            const failed = Object.values(needs).some(({ result: r }) => notRun(r)) || !changesRan;

            const lines = [];
            if (!changesRan) {
              const how = needs.changes?.result === 'cancelled' ? 'was cancelled' : 'failed';
              lines.push(`⚠️ *Change detection ${how}, so the checks below didn't run.*`, '');
            }
            for (const { title, job, rows, metrics } of sections) {
              const { result: jobResult, outputs = {} } = needs[job] ?? {};
              lines.push(`### ${title}`, '');
              if (jobResult === 'cancelled') {
                lines.push('⏹️ *Cancelled*', '');
                continue;
              }
              if (jobResult === 'skipped') {
                lines.push(changesRan ? `⏭️ *No ${title.toLowerCase()} changes*` : '⚠️ *Not run*', '');
                continue;
              }
              lines.push('| Check | Result |', '|:------|:-------|');
              for (const [emoji, label, key] of rows) lines.push(`| ${emoji} **${label}** | ${result(outputs[key])} |`);
              lines.push('');
              const values = (metrics?.(outputs) ?? []).filter(([, value]) => value);
              if (values.length) {
                lines.push('<details>', `<summary>${title} metrics</summary>`, '');
                lines.push('| Metric | Value |', '|:-------|------:|');
                for (const [name, value] of values) lines.push(`| ${name} | ${value} |`);
                lines.push('', '</details>', '');
              }
            }

            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## 🔍 PR check results',
              '',
              `**Overall:** ${failed ? '❌ Some checks failed or didn\'t run' : '✅ All checks passed'}`,
              '',
              ...lines,
              '🔗 External links are checked nightly, after the deploy. The PR title and template have their own checks.',
              '',
              '---',
              `<sub>📦 Commit \`${process.env.HEAD_SHA.slice(0, 7)}\` · [View run](${run})</sub>`,
              '',
              marker,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  close_preview:
    name: Close PR preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
