# Dependabot opens security updates only; Renovate (.github/renovate.json) handles version
# updates. open-pull-requests-limit: 0 turns version updates off and leaves security updates
# on (with "Dependabot security updates" enabled in the repo settings). Each ecosystem's
# fixes come grouped into one pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    # Delays version updates only (which are off); security updates aren't delayed.
    cooldown:
      default-days: 7
    labels: [dependencies, security]
    commit-message:
      prefix: fix
      include: scope
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    # Delays version updates only (which are off); security updates aren't delayed.
    cooldown:
      default-days: 7
    labels: [dependencies, security]
    commit-message:
      prefix: fix
      include: scope
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: terraform
    directories:
      - /infrastructure/modules/azure/resource-group
      - /infrastructure/modules/azure/static-web-app
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    # Delays version updates only (which are off); security updates aren't delayed.
    cooldown:
      default-days: 7
    labels: [dependencies, security]
    commit-message:
      prefix: fix
      include: scope
    groups:
      opentofu-security:
        applies-to: security-updates
        patterns: ['*']
