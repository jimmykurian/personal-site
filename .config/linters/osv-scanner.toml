# OSV-Scanner (task lint:osv) checks website/pnpm-lock.yaml against the OSV database, which
# includes advisories below pnpm audit's high level. None is ignored today: advisories are
# fixed with overrides in website/pnpm-workspace.yaml, or the unused package (extract-zip,
# sprintf-js, chromium-bidi) is removed from the tree there. An advisory with no fix can be
# ignored here with [[IgnoredVulns]] and a reason, and again for pnpm audit in
# pnpm-workspace.yaml (auditConfig.ignoreGhsas); remove both once a fix ships.
