# OSV-Scanner (task lint:osv) checks website/pnpm-lock.yaml against the OSV database, which
# includes advisories below pnpm audit's high level. Each ignored advisory needs a reason;
# remove it once a fix ships. The same advisories are ignored for pnpm audit in
# website/pnpm-workspace.yaml. extract-zip and sprintf-js are removed from the tree there
# instead of ignored.

# braces stack exhaustion on deeply nested patterns: no patched release for 3.x. It reaches
# the repo through markdownlint-cli2's globbing, which only expands this repo's own patterns.
[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
reason = "No patched release; markdownlint-cli2 expands only this repo's own glob patterns"
